[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "form4clean"
version = "0.1.0"
description = "Clean, standardized, research-ready SEC insider trading data from Form 4 filings."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Carson Jones" }]
keywords = [
  "sec",
  "edgar",
  "form-4",
  "insider-trading",
  "financial-data",
  "data-cleaning",
  "duckdb",
  "polars",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Investment",
  "Typing :: Typed",
]
dependencies = [
  "defusedxml>=0.7",
  "duckdb>=1.1",
  "fastapi>=0.115",
  "httpx>=0.27",
  "pandas>=2.2",
  "polars>=1.20",
  "pyarrow>=17",
  "pydantic>=2.8",
  "pytz>=2024.1",
  "typer>=0.12",
  "tzdata>=2024.1",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
# Opt-in price provider that reads Yahoo Finance's unofficial feed. Never installed by default.
yfinance = ["yfinance>=0.2.54"]
dev = ["mypy>=1.11", "pandas-stubs>=2.2", "pytest>=8", "ruff>=0.6", "types-defusedxml>=0.7"]

[project.scripts]
form4clean = "form4clean.cli:app"

[project.urls]
Homepage = "https://github.com/wavebyrd/form4clean"
Issues = "https://github.com/wavebyrd/form4clean/issues"
Documentation = "https://github.com/wavebyrd/form4clean/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/form4clean"]
artifacts = ["src/form4clean/api/static/**"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "README.md", "LICENSE", "CHANGELOG.md"]
artifacts = ["src/form4clean/api/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not live'"
pythonpath = ["."]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
markers = ["live: makes real requests to SEC EDGAR (run with -m live)"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PT"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["form4clean"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pyarrow.*", "yfinance"]
ignore_missing_imports = true
